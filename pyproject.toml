[project]
name = "okb"
version = "0.1.0"
description = "OpenKnowledge — team knowledge base over work sources (one table, MCP out)"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "openai>=1.60",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "markitdown[docx,xlsx,xls,pptx,pdf]>=0.1.1",
    "pypdf>=5.0",
    "pymupdf>=1.24",
    "typer>=0.12",
    "fastmcp>=2.10",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
okb = "okb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okb"]
